/* ============================================================
   ROXETVPN — subscription status template (royal / platinum edition)
   ============================================================ */
:root{
  --radius-lg:24px;--radius-md:16px;--radius-sm:12px;--radius-pill:999px;
  --good:#3FCE8E;--warn:#E7B23C;--bad:#F0555B;--info:#4F8CFF;
  --font-fa:'Vazirmatn','Inter',sans-serif;--font-en:'Inter','Vazirmatn',sans-serif;--font-display:'Cormorant Garamond','Vazirmatn',serif;--font-brand:'Cinzel','Cormorant Garamond',serif;
}
html[data-theme="dark"]{
  --bg:#07080B;--bg-grid:rgba(200,205,215,.035);
  --surface:#111318;--surface-2:#171A20;
  --border:rgba(200,205,220,.09);--border-strong:rgba(200,205,220,.18);
  --text:#EEF0F4;--text-dim:#8A8F9C;
  --accent:#D9DEE8;--accent-soft:rgba(217,222,232,.08);
  --metal:linear-gradient(120deg,#8A8F9C,#EAEDF2 45%,#8A8F9C 70%,#4A4E58);
  --shadow:0 12px 34px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#EFEFF2;--bg-grid:rgba(10,12,20,.035);
  --surface:#FFFFFF;--surface-2:#F4F5F8;
  --border:rgba(10,12,25,.09);--border-strong:rgba(10,12,25,.16);
  --text:#101218;--text-dim:#666B78;
  --accent:#20232C;--accent-soft:rgba(20,22,30,.06);
  --metal:linear-gradient(120deg,#8A8F9C,#20232C 45%,#8A8F9C 70%,#B7BCC8);
  --shadow:0 12px 30px rgba(20,22,35,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;height:100%}
.icon-btn,.pill-btn,.action-btn,.tab-btn,.range-btn,.config-row{touch-action:manipulation}
.icon-btn,.pill-btn,.action-btn,.tab-btn{transform:translateZ(0)}
body{background:var(--bg);color:var(--text);font-family:var(--font-fa);overflow-x:hidden;transition:background .25s ease,color .25s ease}
html[data-lang="en"] body{font-family:var(--font-en)}
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle at 12% 4%,var(--accent-soft),transparent 42%),radial-gradient(circle at 92% 88%,var(--accent-soft),transparent 46%),linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:auto,auto,28px 28px,28px 28px}
.app{position:relative;z-index:1;max-width:420px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:11px 11px calc(88px + env(safe-area-inset-bottom)) 11px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:9px 11px;margin-bottom:11px;box-shadow:var(--shadow)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn,.pill-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius-pill);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease,background .2s ease,border-color .2s ease}
.icon-btn{width:40px;height:40px}.icon-btn:active,.pill-btn:active{transform:scale(.92)}
.pill-btn{height:40px;padding:0 16px;font-size:13px;font-weight:600;white-space:nowrap}
.icon-btn.accent{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border));background:color-mix(in srgb,var(--bad) 10%,var(--surface));animation:callGlow 2.2s ease-in-out infinite}
@keyframes callGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 12px 3px color-mix(in srgb,var(--bad) 55%,transparent)}}
.icon-btn svg,.pill-btn svg{width:18px;height:18px}
.brand{display:flex;align-items:center;gap:13px}
.brand-logo-wrap{position:relative;width:48px;height:48px;flex-shrink:0}
.brand-logo-wrap::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--metal);opacity:.55}
.brand-logo{position:relative;width:48px;height:48px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);color:var(--accent);background:var(--surface-2)}
.brand-mark svg{width:32px;height:32px;display:block}
.brand-text{text-align:end;line-height:1.2}
.brand-name{font-family:var(--font-brand);font-weight:700;font-size:15px;letter-spacing:.4px;color:var(--text)}
.brand-tagline{font-size:11px;color:var(--text-dim);margin-top:3px;letter-spacing:.2px}
.iran-clock-wrap{display:flex;align-items:center;gap:8px;direction:rtl;white-space:nowrap}
.iran-clock{font-family:var(--font-fa);font-size:21px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums;color:var(--text)}
.iran-date{font-size:10px;font-weight:700;color:var(--text-dim);padding-top:2px}
.banner{border-radius:var(--radius-md);padding:14px 16px;text-align:center;font-weight:700;font-size:14px;margin-bottom:14px;border:1px solid transparent}
.banner.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:color-mix(in srgb,var(--warn) 30%,var(--border))}
.banner.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:color-mix(in srgb,var(--bad) 28%,var(--border))}
.banner.hidden{display:none}

async function copyText(str){try{await navigator.clipboard.writeText(str)}catch(e){const ta=document.createElement("textarea");ta.value=str;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e2){}document.body.removeChild(ta)}toast(t("copied"))}
function toLocalDigits(str){if(state.lang!=="fa")return str;const map={"0":"۰","1":"۱","2":"۲","3":"۳","4":"۴","5":"۵","6":"۶","7":"۷","8":"۸","9":"۹"};return String(str).replace(/[0-9]/g,d=>map[d])}
function formatBytes(bytes){if(bytes===null||bytes===undefined||isNaN(bytes))return t("unknown");const unitsFa=["بایت","کیلوبایت","مگابایت","گیگابایت","ترابایت"],unitsEn=["B","KB","MB","GB","TB"],units=state.lang==="fa"?unitsFa:unitsEn;if(bytes===0)return toLocalDigits("0")+" "+units[0];let i=Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),units.length-1),val=bytes/Math.pow(1024,i),str=(val>=100||i===0)?Math.round(val).toString():val.toFixed(val<10?2:1);return toLocalDigits(str)+" "+units[i]}
function gregorianToJalali(gy,gm,gd){const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];let jy;const gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g_d_m[gm-1];jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+days%31}else{jm=7+Math.floor((days-186)/30);jd=1+(days-186)%30}return[jy,jm,jd]}
const FA_MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"],EN_MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function formatDate(ts){if(!ts)return t("unknown");const d=new Date(ts);if(state.lang==="fa"){const[jy,jm,jd]=gregorianToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());return toLocalDigits(jd)+" "+FA_MONTHS[jm-1]+" "+toLocalDigits(jy)}return d.getDate()+" "+EN_MONTHS[d.getMonth()]+" "+d.getFullYear()}
function parseTimestamp(v){if(v===null||v===undefined||v===""||v===0)return null;if(typeof v==="number")return v>2000000000?v:v*1000;const p=Date.parse(v);return isNaN(p)?null:p}
function pick(obj,keys){for(const k of keys)if(obj&&obj[k]!==undefined&&obj[k]!==null)return obj[k];return undefined}
function normalize(json){const links=pick(json,["links","configs","uris"])||[],up=pick(json,["up","upload","uplink"]),down=pick(json,["down","download","downlink"]);let used=pick(json,["used_traffic","used","usedTraffic","total_used"]);if(used===undefined&&(up!==undefined||down!==undefined))used=(Number(up)||0)+(Number(down)||0);return{username:pick(json,["username","name","email","client_name","remark"])??"__USER_NAME__",rawStatus:pick(json,["status","state"])??null,data_limit:Number(pick(json,["data_limit","dataLimit","total","total_gb_bytes"])??0)||0,used_traffic:Number(used??0)||0,expireTs:parseTimestamp(pick(json,["expire","expiry_time","expiredAt","expire_date","expires_at"])),createdTs:parseTimestamp(pick(json,["created_at","createdAt","since"])),editedTs:parseTimestamp(pick(json,["sub_updated_at","updated_at","last_edited","modified_at"])),onlineTs:parseTimestamp(pick(json,["online_at","last_online","lastConnectedAt"])),lastIp:pick(json,["last_ip","lastIp","sub_last_ip"])??null,deviceLimit:pick(json,["device_limit","max_devices","sub_limit"])??null,subscription_url:pick(json,["subscription_url","sub_url","subLink"])??window.location.href,links:Array.isArray(links)?links:[],appsCount:Array.isArray(pick(json,["apps"])||[])?(pick(json,["apps"])||[]).length:0,usages:pick(json,["usages","node_usages","daily_usages"])||null}}
function computeState(d){const now=Date.now(),hasLimit=d.data_limit>0,remaining=hasLimit?Math.max(d.data_limit-d.used_traffic,0):null,hasExpire=!!d.expireTs,timeLeftMs=hasExpire?d.expireTs-now:null,expiredByTime=hasExpire&&timeLeftMs<=0,expiredByData=hasLimit&&remaining<=0,nearData=hasLimit&&remaining>0&&remaining<=100*1024*1024,nearTime=hasExpire&&timeLeftMs>0&&timeLeftMs<=24*60*60*1000,nearAny=nearData||nearTime;let status="active";if(d.rawStatus&&/disab|inactive|off|block/i.test(String(d.rawStatus)))status="disabled";else if(expiredByData)status="dataexpired";else if(expiredByTime)status="expired";return{status,remaining,hasLimit,hasExpire,timeLeftMs,nearData,nearTime,nearAny,expiredByTime,expiredByData}}

function render(d){const cs=computeState(d),banner=document.getElementById("banner");if(cs.status==="expired"||cs.status==="dataexpired"){banner.textContent=t("bannerEnded");banner.className="banner bad"}else if(cs.nearAny){banner.textContent=t("bannerNear");banner.className="banner bad"}else banner.className="banner hidden";const chip=document.getElementById("statusChip");chip.classList.remove("active","disabled","expired","dataexpired");chip.classList.add(cs.status);chip.querySelector(".txt").textContent=cs.status==="active"?t("statusActive"):cs.status==="disabled"?t("statusDisabled"):cs.status==="dataexpired"?t("statusDataExpired"):t("statusExpired");document.getElementById("chipConfigs").textContent=toLocalDigits(d.links.length)+" "+t("configs");document.getElementById("chipApps").textContent=toLocalDigits(d.appsCount||0)+" "+t("apps");document.getElementById("chipLimit").textContent=cs.hasLimit?formatBytes(d.data_limit):t("unlimited");document.getElementById("usernameTitle").textContent=d.username||t("unknown");const daysLeft=cs.hasExpire?Math.max(Math.ceil(cs.timeLeftMs/86400000),0):null,cards=[{icon:"clock",tone:"amber",lbl:"lblTimeLeft",val:cs.hasExpire?toLocalDigits(daysLeft)+" "+t("days"):t("unlimited"),warn:cs.expiredByTime||cs.nearTime},{icon:"up",tone:"teal",lbl:"lblUsed",val:formatBytes(d.used_traffic)},{icon:"db",tone:"purple",lbl:"lblTotal",val:cs.hasLimit?formatBytes(d.data_limit):t("unlimited")},{icon:"drop",tone:"green",lbl:"lblRemaining",val:cs.hasLimit?formatBytes(cs.remaining):t("unlimited"),warn:cs.nearData||cs.expiredByData},{icon:"bars",tone:"orange",lbl:"lblTotalUsed",val:formatBytes(d.used_traffic)},{icon:"pulse",tone:"gray",lbl:"lblLastConnect",val:d.onlineTs?formatDate(d.onlineTs):t("never")},{icon:"refresh",tone:"pink",lbl:"lblLastEdited",val:d.editedTs?formatDate(d.editedTs):t("unknown")},{icon:"calendar",tone:"blue",lbl:"lblCreated",val:d.createdTs?formatDate(d.createdTs):t("unknown")},{icon:"phone",tone:"lime",lbl:"lblDeviceLimit",val:d.deviceLimit||t("unlimited")},{icon:"globe",tone:"orange",lbl:"lblLastIp",val:d.lastIp||t("unknown")}];document.getElementById("statGrid").innerHTML=cards.map(c=>`<div class="stat-card ${c.warn?"warn-val":""}"><div class="icn tone-${c.tone}">${ICONS[c.icon]}</div><div class="lbl">${t(c.lbl)}</div><div class="val">${c.val}</div></div>`).join("");renderChart(d.usages);renderConfigs(d)}
function renderChart(usages){const area=document.getElementById("chartArea");if(!usages||!Array.isArray(usages)||usages.length===0){area.innerHTML=`<div class="chart-empty">${t("noStats")}</div>`;return}const max=Math.max(...usages.map(u=>Number(u.total||u.value||0)),1);area.innerHTML=`<div class="chart-bars">${usages.map(u=>{const val=Number(u.total||u.value||0),h=Math.max(val/max*100,3),label=u.label||(u.date?new Date(u.date).getDate():"");return`<div class="bar-wrap"><div class="bar" style="height:${h}%"></div><div class="bar-label">${toLocalDigits(label)}</div></div>`}).join("")}</div>`}

function extractFlag(name){const m=String(name).match(/^(\p{Regional_Indicator}{2}|[\u2600-\u27BF\u{1F300}-\u{1FAFF}])/u);return m?m[0]:null}
function renderConfigs(d){const list=document.getElementById("configList"),rows=[];rows.push(`<div class="config-row" data-copy="${encodeURIComponent(d.subscription_url)}" data-qr="${encodeURIComponent(d.subscription_url)}" data-title="${encodeURIComponent(t("subLinkRow"))}"><div class="globe">${ICONS.link}</div><div class="name">${t("subLinkRow")}</div><div class="row-actions"><button class="icon-btn qr-trigger" type="button">${ICONS.qr}</button><button class="icon-btn copy-trigger" type="button">${ICONS.copy}</button></div></div>`);d.links.forEach((uri,idx)=>{const name=extractName(uri,idx),flag=extractFlag(name),iconHtml=flag?`<span class="flag-emoji">${flag}</span>`:ICONS.globe;rows.push(`<div class="config-row" data-copy="${encodeURIComponent(uri)}" data-qr="${encodeURIComponent(uri)}" data-title="${encodeURIComponent(name)}"><div class="globe">${iconHtml}</div><div class="name">${name}</div><div class="row-actions"><button class="icon-btn qr-trigger" type="button">${ICONS.qr}</button><button class="icon-btn copy-trigger" type="button">${ICONS.copy}</button></div></div>`)});list.innerHTML=rows.join("");list.querySelectorAll(".copy-trigger").forEach(btn=>btn.addEventListener("click",e=>{const row=e.target.closest(".config-row");copyText(decodeURIComponent(row.dataset.copy))}));list.querySelectorAll(".qr-trigger").forEach(btn=>btn.addEventListener("click",e=>{const row=e.target.closest(".config-row");openQr(decodeURIComponent(row.dataset.qr),decodeURIComponent(row.dataset.title))}))}
function openQr(text,title){const box=document.getElementById("qrBox");box.innerHTML="";try{new QRCode(box,{text,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){box.innerHTML='<div style="color:#111;padding:20px;font-size:12px;">QR</div>'}document.getElementById("qrModalTitle").textContent=title||t("subLinkRow");document.getElementById("qrModal").classList.remove("hidden")}

function tryBase64Decode(text){try{return atob(text.trim().replace(/-/g,"+").replace(/_/g,"/"))}catch(e){return null}}
function renderFromRaw(text){let content=text;const decoded=tryBase64Decode(text);if(decoded&&/:\/\//.test(decoded))content=decoded;const links=content.split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length&&/:\/\//.test(s));const d=normalize({links});d.subscription_url=window.location.href;state.data=d;render(d)}
async function loadSubscription(){
const url=window.location.href.split("#")[0];
try{
 const res=await fetch(url,{headers:{"Accept":"text/plain"},cache:"no-store"});
 const ct=(res.headers.get("content-type")||"").toLowerCase();
 const text=await res.text();
 if(ct.includes("application/json")){const d=normalize(JSON.parse(text));state.data=d;render(d);return;}
 const decoded=tryBase64Decode(text);
 if(decoded&&/:\/\//.test(decoded)){renderFromRaw(text);return;}
 const links=text.split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length&&/:\/\//.test(s));
 if(links.length){renderFromRaw(text);return;}
 render(normalize({links:[]}));
}catch(err){
 const d=normalize({username:"__USER_NAME__",links:[]});
 state.data=d;render(d);
}}
applyLangDom();applyThemeDom();loadSubscription();
})();
